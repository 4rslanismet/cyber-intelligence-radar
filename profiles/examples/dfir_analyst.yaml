# Example research profile: DFIR (Digital Forensics & Incident Response)
# Analyst.
#
# Minimal example - no extraction_schema (collection-only). Copy into
# profiles/ and add to ACTIVE_RESEARCH_PROFILES to activate.
id: dfir_analyst
title: "DFIR Analyst"
mode: research
snowball: false
per_query_max_results: 25

